# Synology Container Manager: Project -> Create -> point it at the folder
# holding this file, then Build. See the README for the full walkthrough.

services:
  hls-proxy:
    build: .
    image: hls-referer-proxy:latest
    container_name: hls-proxy

    ports:
      # host:container -- change only the left number if 8765 is already taken
      # on your NAS. The right one is fixed by the Dockerfile.
      - "8765:8765"

    # Comes back on its own after a NAS reboot or a crash, but stays down if
    # you stop it deliberately.
    restart: unless-stopped

    # Point it at a different station without touching the image:
    # command: ["--host", "0.0.0.0", "--port", "8765",
    #           "--stream-url", "https://example.com/live.m3u8",
    #           "--referer", "https://example.com/",
    #           "--name", "Example FM"]

    healthcheck:
      # Hits the playlist endpoint, so this goes red if the origin starts
      # refusing the Referer rather than only when the container has died.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/stream.m3u8', timeout=10).status == 200 else 1)"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3

    # It only makes outbound HTTPS requests and serves one port.
    security_opt:
      - no-new-privileges:true
    read_only: true

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
